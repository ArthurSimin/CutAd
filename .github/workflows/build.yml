name: Build, test, and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      local_models:
        description: Run the local background removal and reframe tests
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            exe: cutad
          - os: windows-2022
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            exe: cutad.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Set up Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config
          work="$(mktemp -d)"
          curl -fsSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-gpl.tar.xz -o "$work/ffmpeg.tar.xz"
          tar -xf "$work/ffmpeg.tar.xz" -C "$work"
          find "$work" -type f -name ffmpeg -printf '%h\n' >> "$GITHUB_PATH"
      - name: Set up Windows FFmpeg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "cutad-ffmpeg"
          New-Item -ItemType Directory -Path $work | Out-Null
          curl.exe -fsSL --retry 3 https://github.com/GyanD/codexffmpeg/releases/download/8.0.1/ffmpeg-8.0.1-essentials_build.zip -o "$work/ffmpeg.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive "$work/ffmpeg.zip" $work
          Join-Path $work 'ffmpeg-8.0.1-essentials_build/bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: ffmpeg -version
      - run: cargo +stable fmt --check
      - run: cargo +stable test --locked --release -- --test-threads=1
      - uses: actions/setup-python@v5
        if: inputs.local_models
        with:
          python-version: '3.12'
      - name: Install local inference dependencies
        if: inputs.local_models
        run: python -m pip install "rembg[cpu]==2.0.69"
      - name: Fetch local model test fixtures
        if: inputs.local_models
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          import pathlib
          import sys
          import subprocess

          fixtures = {
              "CUTAD_TEST_ONNX": (
                  "https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx",
                  "309c8469258dda742793dce0ebea8e6dd393174f89934733ecc8b14c76f4ddd8",
              ),
              "CUTAD_TEST_CUTOUT_PHOTO": (
                  "https://raw.githubusercontent.com/scikit-image/scikit-image/v0.25.2/skimage/data/astronaut.png",
                  "88431cd9653ccd539741b555fb0a46b61558b301d4110412b5bc28b5e3ea6cb5",
              ),
          }
          work = pathlib.Path(os.environ["RUNNER_TEMP"]) / "cutad-model-tests"
          work.mkdir(exist_ok=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"CUTAD_CUTOUT_PYTHON={sys.executable}\n")
              for variable, (url, checksum) in fixtures.items():
                  path = work / url.rsplit("/", 1)[-1]
                  subprocess.run(
                      ["curl", "-fsSL", "--retry", "3", "--max-time", "60", url, "-o", str(path)],
                      check=True,
                  )
                  if hashlib.sha256(path.read_bytes()).hexdigest() != checksum:
                      raise RuntimeError(f"Checksum mismatch for {variable}")
                  environment.write(f"{variable}={path}\n")
          PY
      - name: Test offline background removal and reframing
        if: inputs.local_models
        run: cargo +stable test --locked --release --test cutout -- --include-ignored --test-threads=1
      - run: cargo +stable build --locked --release
      - name: Package tagged build
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          actual="$(cargo +stable metadata --locked --no-deps --format-version=1 | python -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "$version" = "$actual"
          python scripts/package.py "${{ matrix.target }}" "${{ matrix.platform }}" "target/release/${{ matrix.exe }}" "$version"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: ${{ matrix.platform }}
          path: dist/CutAd-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum CutAd-*.zip CutAd-*.tar.gz > SHA256SUMS
          notes=()
          if [[ -f "../docs/releases/$TAG.md" ]]; then notes=(--notes-file "../docs/releases/$TAG.md"); fi
          release_flags=()
          if [[ "$TAG" == *-* ]]; then release_flags=(--prerelease --latest=false); fi
          gh release create "$TAG" --verify-tag "${release_flags[@]}" --title "CutAd ${TAG#v}" --generate-notes "${notes[@]}" CutAd-*.zip CutAd-*.tar.gz SHA256SUMS
