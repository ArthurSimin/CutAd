[package]
name = "cutad"
version = "1.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "An offline desktop video editor for Linux and Windows"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:rfd", "dep:rodio"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
epaint_default_fonts = "0.36.2"
fontdb = "0.24.0"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
rfd = { version = "0.15.4", optional = true }
rodio = { version = "0.21.1", default-features = false, features = ["playback", "mp4"], optional = true }
scraper = { version = "0.29.0", default-features = false }
encoding_rs = "0.8.44"

[[bin]]
name = "cutad"
path = "src/main.rs"
required-features = ["desktop"]

[profile.release]
strip = true
